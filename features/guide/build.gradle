plugins {
    id 'com.android.library'
    id 'com.jakewharton.butterknife'
}

dependencies {

    implementation project(":platform:core")
    implementation project(':platform:lib')
    implementation project(":platform:base")
    implementation Libs.INSTANCE.appCompat
    implementation Libs.INSTANCE.material
    implementation Libs.INSTANCE.butterknife
    annotationProcessor Libs.INSTANCE.butterknifeAnnotation
    implementation Libs.INSTANCE.rxjava
    implementation Libs.INSTANCE.rxAndroid
    implementation Libs.INSTANCE.ARouter
    annotationProcessor Libs.INSTANCE.ARouterAnnotation
    implementation Libs.INSTANCE.autoDispose
    implementation Libs.INSTANCE.autoDisposeLifecycle
    implementation Libs.INSTANCE.autoDisposeArchComponents
    implementation Libs.INSTANCE.lifecycleJava8
    implementation Libs.INSTANCE.logger
    implementation Libs.INSTANCE.segmentedButton
    implementation Libs.INSTANCE.localization
    implementation Libs.INSTANCE.glide
}
